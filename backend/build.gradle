plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.2.3'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.web3j' version '4.12.2'
    id "org.web3j.solidity" version "0.5.2"
}

group = 'com.crowdfunding'
version = '0.1.0'
sourceCompatibility = '21'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-context:6.1.3'
    implementation 'org.web3j:core:4.12.2'
    implementation 'org.postgresql:postgresql'
    implementation 'org.projectlombok:lombok'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql:1.19.3'
    testImplementation libs.junit

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.crowdfunding.CrowdFundingApplication'
}

web3j {
    generatedPackageName = 'com.crowdfunding.contracts'
    includedContracts = ['AdminManager', 'FundManager', 'MilestoneManager', 'ProposalManager', 'RoleManager'] 
    useNativeJavaTypes = true
    generatedFilesBaseDir = 'src'
}

// Add this configuration block
tasks.withType(org.web3j.gradle.plugin.GenerateContractWrappers).configureEach {
    dependsOn(tasks.processResources)
}