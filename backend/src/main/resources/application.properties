spring.application.name=crowdfunding

spring.datasource.url=jdbc:postgresql://localhost:5432/crowdfunding
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.web=INFO

# Web3j Configuration
web3j.client-address=http://localhost:8545
web3j.gas-price=20000000000
web3j.gas-limit=6721975

# Contract Addresses
contract.admin-manager.address=0x...
contract.proposal-manager.address=0x...
contract.milestone-manager.address=0x...
contract.fund-manager.address=0x...
contract.role-manager.address=0x...

# JWT Configuration
jwt.secret=your-secret-key
jwt.expiration=86400000